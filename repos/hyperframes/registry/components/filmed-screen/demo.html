<!doctype html>
<!--
  filmed-screen demo: a white search homepage for a made-up engine, "lumen", filmed with the
  component's defaults. A query types letter by letter and the camera follows each new letter
  while it orbits from one side of the screen to the other.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fff;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .page {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        background: #fff;
        font-family: Arial, Helvetica, "DejaVu Sans", sans-serif;
        color: #202124;
      }
      .logo {
        position: absolute;
        left: 0;
        right: 0;
        top: 290px;
        text-align: center;
        font-size: 160px;
        font-weight: 700;
        letter-spacing: -8px;
        font-family: Inter, Arial, sans-serif;
        line-height: 1.1;
        background: linear-gradient(100deg, #6c4cf5 10%, #b44df2 48%, #f2647a 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .logo i {
        display: inline-block;
        width: 26px;
        height: 26px;
        margin-left: 8px;
        border-radius: 50%;
        background: #f2647a;
      }
      .search {
        position: absolute;
        left: 520px;
        top: 520px;
        width: 880px;
        height: 74px;
        border-radius: 37px;
        border: 2px solid #dfe1e5;
        display: flex;
        align-items: center;
        padding: 0 30px;
        gap: 22px;
        box-shadow: 0 2px 8px rgba(32, 33, 36, 0.18);
      }
      .search svg {
        flex: none;
      }
      #q {
        font-size: 30px;
        white-space: nowrap;
        color: #202124;
      }
      #q span {
        display: none;
      }
      #caret {
        display: inline-block;
        width: 2px;
        height: 34px;
        background: #202124;
        vertical-align: middle;
        margin-left: 1px;
      }
      .buttons {
        position: absolute;
        left: 0;
        right: 0;
        top: 650px;
        display: flex;
        justify-content: center;
        gap: 18px;
      }
      .buttons div {
        padding: 16px 28px;
        background: #f8f9fa;
        border: 1px solid #f8f9fa;
        border-radius: 8px;
        font-size: 22px;
        color: #3c4043;
      }
      .lang {
        position: absolute;
        left: 0;
        right: 0;
        top: 760px;
        text-align: center;
        font-size: 20px;
        color: #4d5156;
      }
      .lang b {
        color: #1a0dab;
        font-weight: 400;
        margin: 0 6px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="filmed-screen-demo"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <canvas
        class="hf-filmed-screen"
        layoutsubtree
        width="1920"
        height="1080"
        style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px"
      >
        <div
          class="hf-filmed-screen-scene"
          style="
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #fff;
          "
        >
          <div class="page">
            <div class="logo">lumen<i></i></div>
            <div class="search" id="box">
              <svg width="28" height="28" viewBox="0 0 24 24">
                <circle cx="10" cy="10" r="6.5" fill="none" stroke="#9aa0a6" stroke-width="2.2" />
                <line
                  x1="15"
                  y1="15"
                  x2="21"
                  y2="21"
                  stroke="#9aa0a6"
                  stroke-width="2.2"
                  stroke-linecap="round"
                />
              </svg>
              <div id="q">
                <span class="c">h</span><span class="c">o</span><span class="c">w</span
                ><span class="c">&nbsp;</span><span class="c">d</span><span class="c">o</span
                ><span class="c">&nbsp;</span><span class="c">c</span><span class="c">a</span
                ><span class="c">m</span><span class="c">e</span><span class="c">r</span
                ><span class="c">a</span><span class="c">s</span><span class="c">&nbsp;</span
                ><span class="c">f</span><span class="c">o</span><span class="c">c</span
                ><span class="c">u</span><span class="c">s</span
                ><span id="caret" style="display: inline-block"></span>
              </div>
            </div>
            <div class="buttons">
              <div>Search</div>
              <div>Surprise me</div>
            </div>
            <div class="lang">Search the web, privately. <b>Learn how</b></div>
          </div>
        </div>
      </canvas>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const chars = Array.from(document.querySelectorAll("#q span.c"));
      // Typing schedule: a human-ish rhythm, deterministic (no Math.random).
      const rhythm = [0.13, 0.17, 0.11, 0.2, 0.14, 0.12, 0.18, 0.15];
      const START = 2.0;
      const at = [];
      let t = START;
      chars.forEach((el, i) => {
        at.push(t);
        tl.set(el, { display: "inline" }, t);
        t += rhythm[i % rhythm.length] + (chars[i].textContent === " " ? 0.08 : 0);
      });
      // Caret blinks only while idle (before and after typing), as a real one does.
      const caret = document.getElementById("caret");
      for (let b = 0.5; b < 8; b += 0.5) {
        const idle = b < START || b > t + 0.3;
        tl.set(caret, { opacity: idle ? (Math.round(b * 2) % 2 ? 0 : 1) : 1 }, b);
      }
      tl.to({}, { duration: 8 }, 0);
      window.__timelines["filmed-screen-demo"] = tl;
      tl.seek(0);
      window.__typedAt = at;
    </script>

          gl.bindTexture(gl.TEXTURE_2D, tex);
          [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(function (p) {
            gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR);
          });
          [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(function (p) {
            gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);
          });
          gl.viewport(0, 0, W, H);

          // Seconds on this composition's own timeline, so shots work inside sub-compositions.
          function now() {
            var tl =
              compId &&
              ((window.__timelines && window.__timelines[compId]) ||
                (G.__timelines && G.__timelines[compId]));
            return tl && typeof tl.time === "function" ? tl.time() : lastSeekT;
          }
          function shotAt(t) {
            var start = 0;
            for (var i = 0; i < shots.length; i++) {
              if (t < shots[i].until || i === shots.length - 1)
                return { i: i, shot: shots[i], local: t - start, start: start };
              start = shots[i].until;
            }
          }
          function rectOf(target) {
            if (!target) return null;
            if (!(target instanceof Element)) return target;
            if (
              target.checkVisibility &&
              !target.checkVisibility({ opacityProperty: true, visibilityProperty: true })
            )
              return null;
            var r = target.getBoundingClientRect();
            if (r.width < 2 || r.height < 2) return null;
            var o = (screenEl || src).getBoundingClientRect();
            return {
              x: ((r.left - o.left) * W) / o.width,
              y: ((r.top - o.top) * H) / o.height,
              w: (r.width * W) / o.width,
              h: (r.height * H) / o.height,
            };
          }
          function smoother(x) {
            x = clamp(x, 0, 1);
            return x * x * x * (x * (x * 6 - 15) + 10);
          }
          function lerp(a, b, k) {
            return a + (b - a) * k;
          }
          function lerpArr(a, b, k) {
            return a.map(function (v, i) {
              return lerp(v, b[i], k);
            });
          }
          // One shot's camera at `local` seconds into it. Everything here is a pure function of time.
          function shotCam(i, local) {
            var sh = shots[i],
              start = i > 0 ? shots[i - 1].until : 0,
              len = Math.max(0.001, sh.until - start);
            var sway = Math.sin(i * 1.7 + local * 0.9) * 0.012;
            var tilt = sh.tilt || [0.1, -0.15, 0.02],
              tiltTo = sh.tiltTo || tilt,
              zoom = sh.zoom || [1.1, 1.3];
            return {
              center: sh.center || [W / 2, H / 2],
              // An orbit: the tilt eases from `tilt` to `tiltTo` across the shot.
              rot: [0, 1, 2].map(function (k) {
                return lerp(tilt[k], tiltTo[k], smoother(local / len)) + sway * [1, -0.7, 0.4][k];
              }),
              zoom: lerp(zoom[0], zoom[1], smoother(local / len)),
              blur: sh.blur == null ? 0.45 : sh.blur,
              pal: sh.palette ? [].concat.apply([], sh.palette.map(hex)) : null,
              trueAmt: sh.palette ? 0 : 1,
              inv: sh.invert ? 1 : 0,
            };
          }
          // Shots glide into each other by default: camera, grade and colour mode ease over
          // `glide` seconds. `transition: "cut"` keeps the hard cut and its tear.
          function camAt(t) {
            var s = shotAt(t),
              cam = shotCam(s.i, s.local),
              sh = s.shot;
            cam.cut = 0;
            if (s.i > 0 && sh.transition === "cut") {
              cam.cut = Math.max(0, 1 - s.local * 15);
            } else if (s.i > 0) {
              var glide = sh.glide == null ? 1.2 : sh.glide;
              if (s.local < glide) {
                var prevLen = shots[s.i - 1].until - (s.i > 1 ? shots[s.i - 2].until : 0);
                var p = shotCam(s.i - 1, prevLen + s.local),
                  k = smoother(s.local / glide);
                if (!p.pal) p.pal = cam.pal;
                if (!cam.pal) cam.pal = p.pal;
                ["zoom", "blur", "trueAmt", "inv"].forEach(function (key) {
                  cam[key] = lerp(p[key], cam[key], k);
                });
                cam.center = lerpArr(p.center, cam.center, k);
                cam.rot = lerpArr(p.rot, cam.rot, k);
                if (cam.pal) cam.pal = lerpArr(p.pal, cam.pal, k);
              }
            }
            return { s: s, cam: cam };
          }
          function focusRectAt(t, fallback) {
            var s = shotAt(Math.max(0, t)),
              sh = s.shot;
            var picked = sh.focus ? sh.focus(Math.max(0, t), s.local) : null;
            var rects = []
              .concat(picked || [])
              .map(rectOf)
              .filter(Boolean);
            var f = rects[rects.length - 1];
            return f ? [f.x - 8, f.y - 6, f.w + 16, f.h + 12] : fallback;
          }
          // Focus racks instead of snapping: over the last `rack` seconds, take the target each shot
          // named at that moment, measure where it sits in the DOM now, and Hann-average the boxes.
          // A new target eases in on an S-curve, and with no state kept, any seek order gives the
          // same frame.
          var RACK_TAPS = 12;
          var fs = null,
            awaitingPaint = false;
          function prepare() {
            var t = now(),
              at = camAt(t),
              cam = at.cam;
            var rack = opts.rack == null ? 0.3 : opts.rack;
            var still = [cam.center[0], cam.center[1], 0, 0];
            var rect = [0, 0, 0, 0],
              wsum = 0;
            for (var i = 0; i < RACK_TAPS; i++) {
              var w = 0.5 - 0.5 * Math.cos((2 * Math.PI * (i + 0.5)) / RACK_TAPS);
              var r = focusRectAt(t - (rack * i) / (RACK_TAPS - 1), still);
              for (var j = 0; j < 4; j++) rect[j] += r[j] * w;
              wsum += w;
            }
            rect = rect.map(function (v) {
              return v / wsum;
            });
            var focus = [rect[0] + rect[2] / 2, rect[1] + rect[3] / 2];
            fs = {
              t: t,
              cam: cam,
              rect: rect,
              focus: focus,
              aim: [focus[0] * 0.65 + cam.center[0] * 0.35, focus[1] * 0.65 + cam.center[1] * 0.35],
              out:
                opts.fadeOut === false || !isFinite(DUR) ? 0 : clamp((t - (DUR - 0.4)) / 0.4, 0, 1),
              seed: at.s.i * 31 + Math.floor(at.s.local * 30),
            };
          }
          function draw() {
            // A composition that isn't on screen yet (or any more) has no paint record to capture.
            if (
              src.checkVisibility &&
              !src.checkVisibility({ opacityProperty: true, visibilityProperty: true })
            )
              return false;
            if (!fs) prepare();
            if (screenEl) {
              try {
                srcCtx.clearRect(0, 0, W, H);
                srcCtx.drawElementImage(screenEl, 0, 0);
              } catch (e) {
                // Before the scene's first paint there is nothing to capture yet. That is a wait,
                // not a failure: ask for a paint and draw again when it lands.
                if (/paint record/i.test(e.message)) {
                  if (!awaitingPaint) {
                    awaitingPaint = true;
                    src.addEventListener(
                      "paint",
                      function () {
                        awaitingPaint = false;
                        draw();
                      },
                      { once: true },
                    );
                    try {
                      if (src.requestPaint) src.requestPaint();
                    } catch (_) {}
                  }
                  return false;
                }
                console.error("[filmed-screen] capture failed: " + e.message);
                return false;
              }
            }
            var cam = fs.cam;
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
            gl.uniform1i(loc.uSrc, 0);
            gl.uniform2f(loc.uRes, W, H);
            gl.uniform1f(loc.uTime, fs.t);
            gl.uniform2f(loc.uAim, fs.aim[0], fs.aim[1]);
            gl.uniform1f(loc.uZoom, cam.zoom);
            gl.uniform3f(loc.uRot, cam.rot[0], cam.rot[1], cam.rot[2]);
            gl.uniform2f(loc.uFocus, fs.focus[0], fs.focus[1]);
            gl.uniform4f(loc.uFocusRect, fs.rect[0], fs.rect[1], fs.rect[2], fs.rect[3]);
            gl.uniform1f(loc.uBlur, cam.blur);
            gl.uniform3fv(loc.uP, cam.pal || new Array(15).fill(0));
            gl.uniform1f(loc.uTrue, cam.trueAmt);
            gl.uniform1f(loc.uCut, cam.cut);
            gl.uniform1f(loc.uOut, fs.out);
            gl.uniform1f(loc.uSeed, fs.seed);
            gl.uniform1f(loc.uInv, cam.inv);
            gl.uniform1f(loc.uVig, opts.vignette == null ? 1.0 : opts.vignette);
            gl.uniform1f(loc.uCA, opts.aberration == null ? 2.2 : opts.aberration);
            gl.uniform1f(loc.uLed, opts.led == null ? 0.45 : opts.led);
            // A negative curve would sample outside the frame and fold over.
            gl.uniform1f(loc.uCurve, Math.max(0, opts.curve == null ? 0.15 : opts.curve));
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            fs = null;
            return true;
          }
          function afterPaint(go) {
            if (!screenEl) return go();
            var done = false;
            function once() {
              if (!done) {
                done = true;
                go();
              }
            }
            src.addEventListener("paint", once, { once: true });
            try {
              if (src.requestPaint) src.requestPaint();
            } catch (e) {}
            setTimeout(once, 250);
          }
          var lens = { src: src, prepare: prepare, draw: draw, afterPaint: afterPaint };
          lenses.push(lens);
          // A lens whose canvas leaves the page is dropped on the next frame; destroy() also frees
          // its GL context. The seek hooks stay: they are shared by every lens on the page.
          return {
            destroy: function () {
              lenses = lenses.filter(function (l) {
                return l !== lens;
              });
              var lose = gl.getExtension("WEBGL_lose_context");
              if (lose) lose.loseContext();
              out.remove();
              src.removeAttribute(MOUNTED);
            },
          };
        }

        G.HFFilmedScreen = { mount: mount };
      })();
    </script>
    <script>
      HFFilmedScreen.mount({
        canvas: document.querySelectorAll(".hf-filmed-screen"),
        shots: [
          {
            until: 2.2,
            palette: null,
            tilt: [0.06, 0.24, -0.02],
            tiltTo: [0.08, 0.14, -0.012],
            zoom: [1.28, 1.38],
            blur: 0.8,
            center: [960, 480],
            focus: () => document.getElementById("box"),
          },
          {
            until: 8,
            palette: null,
            glide: 1.0,
            tilt: [0.1, 0.14, -0.012],
            tiltTo: [0.06, -0.24, 0.02],
            zoom: [2.1, 2.5],
            center: [960, 560],
            // The newest letter on screen; before the first one, the caret.
            focus: (t) => {
              const at = window.__typedAt;
              let i = -1;
              while (i + 1 < at.length && at[i + 1] <= t) i++;
              return i < 0
                ? document.getElementById("caret")
                : document.querySelectorAll("#q span.c")[i];
            },
          },
        ],
      });
    </script>
  </body>
